services:
  nexus-postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusdb}
      POSTGRES_USER: ${DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_secret_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexus} -d ${POSTGRES_DB:-nexusdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nexus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://nexus-postgres:5432/nexusdb}
      DB_USERNAME: ${DB_USERNAME:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:-nexus_secret_pw}
      NEXUS_MODE: API
      NEXUS_API_KEY: ${NEXUS_API_KEY:-nexus-admin-key-2026}
      NEXUS_MAX_ATTEMPTS: ${NEXUS_MAX_ATTEMPTS:-3}
    depends_on:
      nexus-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nexus-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-worker-1
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://nexus-postgres:5432/nexusdb}
      DB_USERNAME: ${DB_USERNAME:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:-nexus_secret_pw}
      NEXUS_MODE: WORKER
      NEXUS_WORKER_ID: worker-1
      NEXUS_WORKER_THREADS: ${NEXUS_WORKER_THREADS:-8}
      NEXUS_POLL_INTERVAL_MS: ${NEXUS_POLL_INTERVAL_MS:-500}
      NEXUS_LEASE_DURATION_SECONDS: ${NEXUS_LEASE_DURATION_SECONDS:-15}
      NEXUS_HEARTBEAT_INTERVAL_SECONDS: ${NEXUS_HEARTBEAT_INTERVAL_SECONDS:-5}
      NEXUS_MAX_ATTEMPTS: ${NEXUS_MAX_ATTEMPTS:-3}
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nexus-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-worker-2
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://nexus-postgres:5432/nexusdb}
      DB_USERNAME: ${DB_USERNAME:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:-nexus_secret_pw}
      NEXUS_MODE: WORKER
      NEXUS_WORKER_ID: worker-2
      NEXUS_WORKER_THREADS: ${NEXUS_WORKER_THREADS:-8}
      NEXUS_POLL_INTERVAL_MS: ${NEXUS_POLL_INTERVAL_MS:-500}
      NEXUS_LEASE_DURATION_SECONDS: ${NEXUS_LEASE_DURATION_SECONDS:-15}
      NEXUS_HEARTBEAT_INTERVAL_SECONDS: ${NEXUS_HEARTBEAT_INTERVAL_SECONDS:-5}
      NEXUS_MAX_ATTEMPTS: ${NEXUS_MAX_ATTEMPTS:-3}
    depends_on:
      nexus-postgres:
        condition: service_healthy
      nexus-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
