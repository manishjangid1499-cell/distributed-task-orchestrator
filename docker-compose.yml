version: '3.8'

services:
  nexus-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-orchestrator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEXUS_SCHEDULER_CORE_POOL_SIZE=16
      - NEXUS_SCHEDULER_MAX_POOL_SIZE=64
    restart: unless-stopped
