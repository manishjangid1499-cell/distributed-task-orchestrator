server:
  port: 8080

spring:
  application:
    name: nexus-distributed-orchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexusdb}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus_secret_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

nexus:
  mode: ${NEXUS_MODE:ALL}
  api:
    key: ${NEXUS_API_KEY:}
  worker:
    mode: ${NEXUS_MODE:ALL}
    id: ${NEXUS_WORKER_ID:}
    threads: ${NEXUS_WORKER_THREADS:8}
    poll-interval-ms: ${NEXUS_POLL_INTERVAL_MS:1000}
    lease-duration-seconds: ${NEXUS_LEASE_DURATION_SECONDS:15}
    heartbeat-interval-seconds: ${NEXUS_HEARTBEAT_INTERVAL_SECONDS:5}
    heartbeat-timeout-seconds: ${NEXUS_HEARTBEAT_TIMEOUT_SECONDS:15}
  scheduler:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 1000
    keep-alive-seconds: 60
    heartbeat-timeout-seconds: 15
    supervisor-interval-ms: 5000
    default-max-retries: ${NEXUS_MAX_ATTEMPTS:3}
    retry:
      base-delay-seconds: 2
      max-delay-seconds: 60
    rate-limit:
      default-requests-per-window: 20
      window-seconds: 10
