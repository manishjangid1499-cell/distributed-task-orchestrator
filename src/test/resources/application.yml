server:
  port: 0

spring:
  application:
    name: nexus-test

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

nexus:
  mode: ALL
  api:
    key: test-api-key
  worker:
    id: test-worker-1
    threads: 4
    poll-interval-ms: 200
    lease-duration-seconds: 5
    heartbeat-interval-seconds: 1
    heartbeat-timeout-seconds: 3
  scheduler:
    supervisor-interval-ms: 1000
    default-max-retries: 3
    retry:
      base-delay-seconds: 1
      max-delay-seconds: 5
    rate-limit:
      default-requests-per-window: 20
      window-seconds: 10
